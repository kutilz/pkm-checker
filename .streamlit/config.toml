[server]
# Samakan dengan MAX_FILE_SIZE_MB di config.py
maxUploadSize = 5

[client]
# Sembunyikan menu developer dari pengunjung
toolbarMode = "minimal"

# Aksen biru: merah default Streamlit terbaca seperti "error" di aplikasi checker.
[theme.light]
primaryColor = "#2563eb"

[theme.dark]
primaryColor = "#5b8def"
